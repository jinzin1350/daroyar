<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دارویار</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1b1d21);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --card: var(--tg-theme-secondary-bg-color, #f2f4f6);
    --btn: var(--tg-theme-button-color, #00796b);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, #00796b);
    --danger: var(--tg-theme-destructive-text-color, #d14343);
    --ok: #2e7d32;
    --warn: #b26a00;
    --line: rgba(127, 127, 127, 0.28);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 22px; margin: 6px 0 4px; }
  h2 { font-size: 17px; margin: 22px 0 6px; }
  .muted { color: var(--hint); font-size: 14px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 10px 0;
  }
  .card.tap { cursor: pointer; }
  .name { font-weight: 700; font-size: 18px; }
  .times { margin-top: 4px; font-size: 17px; letter-spacing: 0.2px; }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .bad { color: var(--danger); }
  button {
    font: inherit;
    font-weight: 600;
    width: 100%;
    margin-top: 10px;
    padding: 13px 16px;
    border: 0;
    border-radius: 14px;
    background: var(--btn);
    color: var(--btn-text);
    cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--link); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
  button.small { width: auto; margin: 0; padding: 8px 14px; font-size: 15px; }
  button:disabled { opacity: 0.55; }
  label { display: block; margin: 16px 0 6px; font-weight: 600; }
  input {
    font: inherit;
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
  }
  input[type="time"] { direction: ltr; text-align: center; font-size: 19px; }
  .timeRow { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .timeRow input { flex: 1; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .note {
    border-radius: 12px;
    padding: 10px 12px;
    margin: 10px 0;
    font-size: 14px;
    background: color-mix(in srgb, var(--warn) 12%, transparent);
    color: var(--warn);
  }
  .note.good { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
  .err { color: var(--danger); font-size: 14px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<main id="root"><p class="muted">در حال بارگذاری…</p></main>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var initData = (tg && tg.initData) || "";
  var root = document.getElementById("root");
  var state = { devices: [] };
  var view = { name: "list", device: null, med: null };

  if (tg) { tg.ready(); tg.expand(); }

  // ---------- helpers
  function fa(s) { return String(s).replace(/[0-9]/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; }); }
  function faTime(t) { var p = String(t).split(":"); return fa(Number(p[0]) + ":" + p[1]); }
  function el(tag, attrs) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null) continue;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return e;
  }
  function clear() { root.innerHTML = ""; }
  function haptic(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }
  function device() { return state.devices.find(function (d) { return d.id === view.device; }); }
  function medLabel(m) { return m.dose ? m.name + " — " + m.dose : m.name; }

  function api(path, body) {
    return fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "X-Init-Data": initData, "content-type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (r.status === 401) throw new Error("این صفحه را از داخل تلگرام (دکمهٔ «مدیریت داروها») باز کنید.");
      return r.json();
    });
  }

  function setBack(fn) {
    if (!tg || !tg.BackButton) return;
    tg.BackButton.offClick(onBack);
    onBackFn = fn;
    if (fn) { tg.BackButton.onClick(onBack); tg.BackButton.show(); } else tg.BackButton.hide();
  }
  var onBackFn = null;
  function onBack() { if (onBackFn) onBackFn(); }

  // ---------- views
  function render() {
    if (view.name === "device" && device()) return renderDevice();
    if (view.name === "edit" && device()) return renderEdit();
    view.name = "list";
    renderList();
  }

  function renderList() {
    setBack(null);
    clear();
    root.appendChild(el("h1", { text: "💊 داروهای خانواده" }));
    if (!state.devices.length) {
      root.appendChild(el("div", { class: "card" },
        el("div", { class: "name", text: "هنوز گوشی‌ای وصل نیست" }),
        el("div", { class: "muted", text: "روی گوشی مامان یا بابا «فرستادن کد» را بزنید و پیام کد را برای بات بفرستید (forward کنید). بعد این صفحه را دوباره باز کنید." })
      ));
      return;
    }
    root.appendChild(el("p", { class: "muted", text: "روی هر نفر بزنید تا داروهایش را ببینید یا تغییر دهید." }));
    state.devices.forEach(function (d) {
      var card = el("div", { class: "card tap", onclick: function () { view = { name: "device", device: d.id }; render(); } },
        el("div", { class: "row" }, el("span", { class: "name", text: "👤 " + d.label }), el("span", { class: "muted", text: "‹" })),
        el("div", { class: "muted", text: d.lastSeen ? "آخرین خبر: " + d.lastSeen : "هنوز گزارشی نرسیده" }),
        d.today ? el("div", { class: "times", text: "امروز: " + d.today }) : null,
        d.meds.length ? null : el("div", { class: "warn", text: "هنوز دارویی ثبت نشده" }),
        d.pending ? el("div", { class: "warn", text: "⏳ تغییرات هنوز به گوشی نرسیده" }) : null,
        d.problems.length ? el("div", { class: "bad", text: "🛠 " + d.problems.join("، ") }) : null
      );
      root.appendChild(card);
    });
  }

  function renderDevice() {
    var d = device();
    setBack(function () { view = { name: "list" }; render(); });
    clear();
    root.appendChild(el("h1", { text: "💊 داروهای " + d.label }));
    root.appendChild(el("div", { class: "muted", text: "ساعت‌ها به وقت گوشی " + d.label + " است (الان آنجا ساعت " + d.nowThere + ")." }));
    if (d.pending) {
      root.appendChild(el("div", { class: "note", text: "⏳ تغییرات فرستاده شد ولی هنوز به گوشی نرسیده. وقتی گوشی‌شان به اینترنت وصل باشد، معمولاً تا ۱۵ دقیقه می‌رسد؛ اگر برنامه را باز کنند، فوری." }));
    } else if (d.meds.length) {
      root.appendChild(el("div", { class: "note good", text: "✅ همین فهرست روی گوشی " + d.label + " تنظیم است." }));
    }
    if (!d.meds.length) {
      root.appendChild(el("div", { class: "card" }, el("div", { class: "muted", text: "هنوز دارویی ثبت نشده. اولین دارو را اضافه کنید." })));
    }
    d.meds.forEach(function (m) {
      root.appendChild(el("div", { class: "card tap", onclick: function () { view = { name: "edit", device: d.id, med: m.id }; render(); } },
        el("div", { class: "row" }, el("span", { class: "name", text: medLabel(m) }), el("span", { class: "muted", text: "ویرایش ‹" })),
        el("div", { class: "times", text: "⏰ " + m.times.map(faTime).join("   ") })
      ));
    });
    root.appendChild(el("button", { onclick: function () { view = { name: "edit", device: d.id, med: null }; render(); } }, "➕ افزودن دارو"));
    if (d.today) {
      root.appendChild(el("h2", { text: "امروز" }));
      root.appendChild(el("div", { class: "card" },
        el("div", { class: "times", text: d.today }),
        el("div", { class: "muted", text: "آخرین خبر از گوشی: " + (d.lastSeen || "—") }),
        el("div", { class: "muted", text: "✅ خوردم   ❌ نخوردم   ⚠️ بی‌جواب   ⏳ منتظر   ❓ خبری نرسیده   ▫️ بعداً" })
      ));
    }
  }

  function renderEdit() {
    var d = device();
    var existing = d.meds.find(function (m) { return m.id === view.med; }) || null;
    var times = existing ? existing.times.slice() : ["08:00"];
    setBack(function () { view = { name: "device", device: d.id }; render(); });
    clear();
    root.appendChild(el("h1", { text: existing ? "ویرایش دارو" : "داروی جدید برای " + d.label }));

    var name = el("input", { type: "text", placeholder: "مثلاً: قرص فشار", maxlength: "80" });
    name.value = existing ? existing.name : "";
    var dose = el("input", { type: "text", placeholder: "مثلاً: یک عدد", maxlength: "60" });
    dose.value = existing ? existing.dose || "" : "";
    var timesBox = el("div");
    var err = el("div", { class: "err" });

    function drawTimes() {
      timesBox.innerHTML = "";
      times.forEach(function (t, i) {
        var inp = el("input", { type: "time", value: t, step: "60" });
        inp.addEventListener("change", function () { times[i] = inp.value; });
        timesBox.appendChild(el("div", { class: "timeRow" }, inp,
          el("button", { class: "danger small", onclick: function () { times.splice(i, 1); drawTimes(); } }, "حذف")));
      });
    }
    drawTimes();

    root.appendChild(el("label", { text: "اسم دارو" }));
    root.appendChild(name);
    root.appendChild(el("label", { text: "مقدار (اختیاری)" }));
    root.appendChild(dose);
    root.appendChild(el("label", { text: "ساعت‌های خوردن، هر روز (به وقت گوشی " + d.label + ")" }));
    root.appendChild(timesBox);
    root.appendChild(el("button", { class: "ghost", onclick: function () { times.push("20:00"); drawTimes(); } }, "⏰ افزودن ساعت"));
    root.appendChild(err);

    var save = el("button", {}, "💾 ذخیره و فرستادن");
    save.addEventListener("click", function () {
      var clean = [];
      times.forEach(function (t) { if (/^\d{2}:\d{2}$/.test(t) && clean.indexOf(t) < 0) clean.push(t); });
      clean.sort();
      if (!name.value.trim()) { err.textContent = "اسم دارو را بنویسید."; return; }
      if (!clean.length) { err.textContent = "حداقل یک ساعت لازم است."; return; }
      var med = { id: existing ? existing.id : Date.now(), name: name.value.trim(), dose: dose.value.trim(), times: clean };
      var meds = d.meds.filter(function (m) { return m.id !== med.id; }).concat([med]);
      submit(d, meds, save, err, "ذخیره شد و برای گوشی " + d.label + " فرستاده شد ✅");
    });
    root.appendChild(save);

    if (existing) {
      var del = el("button", { class: "danger" }, "🗑 حذف این دارو");
      del.addEventListener("click", function () {
        var go = function (yes) {
          if (!yes) return;
          submit(d, d.meds.filter(function (m) { return m.id !== existing.id; }), del, err, "حذف شد ✅");
        };
        if (tg && tg.showConfirm) tg.showConfirm("«" + existing.name + "» حذف شود؟", go);
        else go(window.confirm("«" + existing.name + "» حذف شود؟"));
      });
      root.appendChild(del);
    }
  }

  function submit(d, meds, btn, err, okText) {
    btn.disabled = true;
    err.textContent = "";
    api("/api/meds", { device: d.id, meds: meds }).then(function (r) {
      btn.disabled = false;
      if (!r.ok) { err.textContent = r.error || "ذخیره نشد"; haptic("error"); return; }
      d.meds = r.meds;
      d.pending = true;
      haptic("success");
      view = { name: "device", device: d.id };
      render();
      var note = el("div", { class: "note good", text: okText + (r.sent ? "" : " (فعلاً به سرویس‌ها وصل نشد؛ در بررسی بعدی فرستاده می‌شود)") });
      root.insertBefore(note, root.children[1] || null);
    }).catch(function (e) {
      btn.disabled = false;
      err.textContent = e.message || "اشکال در ارتباط";
      haptic("error");
    });
  }

  // ---------- start
  if (!initData) {
    clear();
    root.appendChild(el("div", { class: "card" },
      el("div", { class: "name", text: "دارویار" }),
      el("div", { class: "muted", text: "این صفحه را از داخل تلگرام و با دکمهٔ «💊 مدیریت داروها» در چت بات باز کنید." })));
    return;
  }
  api("/api/state").then(function (s) {
    state = s;
    if (state.devices.length === 1) view = { name: "device", device: state.devices[0].id };
    render();
  }).catch(function (e) {
    clear();
    root.appendChild(el("div", { class: "card" }, el("div", { class: "bad", text: e.message || "اشکال در ارتباط" })));
  });
})();
</script>
</body>
</html>
