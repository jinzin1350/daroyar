name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # With the signing secrets -> real (release) APK for the parents' phones.
      # Without them -> a "test" APK that installs next to the real one.
      - name: Build APK
        id: build
        env:
          KS_B64: ${{ secrets.DAROYAR_KEYSTORE_B64 }}
          DAROYAR_KS_PASS: ${{ secrets.DAROYAR_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p out
          if [ -n "$KS_B64" ] && [ -n "$DAROYAR_KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/daroyar.jks"
            export DAROYAR_KEYSTORE="$RUNNER_TEMP/daroyar.jks"
            echo "kind=release" >> "$GITHUB_OUTPUT"
            ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
            cp app/build/outputs/apk/release/app-release.apk out/daroyar.apk
          else
            echo "kind=test" >> "$GITHUB_OUTPUT"
            ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
            cp app/build/outputs/apk/debug/app-debug.apk out/daroyar-test.apk
          fi
          rm -f "$RUNNER_TEMP/daroyar.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: daroyar-apk
          path: out/*.apk

      - name: Publish release
        if: steps.build.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/daroyar.apk \
            --title "Daroyar 1.0.${{ github.run_number }}" \
            --notes "Install daroyar.apk on the phones. نسخهٔ نهایی — فایل daroyar.apk را دانلود و نصب کنید." \
            --target "$GITHUB_SHA"

      - name: Publish test build
        if: steps.build.outputs.kind == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest out/daroyar-test.apk --prerelease \
            --title "Daroyar test build ${{ github.run_number }}" \
            --notes "Test build (installs as «دارویار تست», next to the real app). Not for the parents' phones." \
            --target "$GITHUB_SHA"

      - name: Keep a copy on the apk branch
        run: |
          cd out
          echo "run=${{ github.run_number }} kind=${{ steps.build.outputs.kind }} sha=$GITHUB_SHA" > BUILD.txt
          git init -q
          git checkout -q -b apk
          git add -A
          git -c user.name="daroyar-bot" -c user.email="daroyar-bot@users.noreply.github.com" \
            commit -qm "APK from run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p logdir
          cp build.log logdir/build.log 2>/dev/null || echo "no build.log" > logdir/build.log
          grep -E "^e: |error:|What went wrong|FAILURE" -A4 logdir/build.log > logdir/errors.txt || true
          cd logdir
          git init -q
          git checkout -q -b build-log
          git add -A
          git -c user.name="daroyar-bot" -c user.email="daroyar-bot@users.noreply.github.com" \
            commit -qm "Build log from run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
